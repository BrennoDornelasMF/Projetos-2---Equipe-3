{% extends 'core/base.html' %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>
            Login
        </h1>

        <form
            method="POST"
            class="auth-form"
        >

            {% csrf_token %}

            {% if erro %}

                <div class="erro-message">

                    {{ erro }}

                </div>

            {% endif %}

            <div class="form-group">

                <label>
                    Usuário
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Digite seu usuário"
                    class="form-input"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    Senha
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Digite sua senha"
                    class="form-input"
                    required
                >

            </div>

            <button
                type="submit"
                class="auth-btn"
            >
                Entrar
            </button>

        </form>

        <div class="auth-footer">

            <p>

                Não possui conta?

                <a href="{% url 'cadastro' %}">

                    Criar conta

                </a>

            </p>

        </div>

    </div>

</div>

{% endblock %}
