{%extends 'core/base.html'%}

{% block content %}

<div class = "auth-container">

    <div class = "auth-card">

        <h1>Login</h1>

        <form method="POST" class="auth-form">
            {% csrf_token %}
            
            <div class = 'form-group'>
                <label>Usuario:</label>
                {{ form.username }}
            </div>

            <div class = 'form-group'>
                <label>Senha:</label>
                {{ form.password }}
            </div> 

            <button type="submit">Entrar</button>

        </form>
    </div>
</div>
{% endblock %}
