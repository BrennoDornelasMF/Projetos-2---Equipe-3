{% extends 'core/base.html' %}

{% block content %}

<div class="biblioteca-form-container">

    <div class="biblioteca-form-card">

        <h1>Editar Livro</h1>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <div class="biblioteca-form-grid">

                <div class="form-group">
                    <label>Título</label>
                    {{ form.titulo }}
                </div>

                <div class="form-group">
                    <label>Autor</label>
                    {{ form.autor }}
                </div>

                <div class="form-group">
                    <label>Categoria</label>
                    {{ form.categoria }}
                </div>

                <div class="form-group">
                    <label>Quantidade</label>
                    {{ form.quantidade }}
                </div>

                <div class="form-group full-width">
                    <label>Status</label>
                    {{ form.status }}
                </div>

                <div class="form-group full-width">
                    <label>Descrição</label>
                    {{ form.descricao }}
                </div>

                <div class="form-group full-width">
                    <label>Capa</label>
                    {{ form.capa }}
                </div>

            </div>

            <br>

            <button type="submit" class="auth-btn">
                Salvar Alterações
            </button>

        </form>

    </div>

</div>

{% endblock %}
