{% extends 'core/base.html' %}

{% block content %}

<div class="biblioteca-form-container">

    <div class="biblioteca-form-card">

        <h1>Registrar Doação</h1>
        <p style="color: #666; margin-bottom: 24px;">Biblioteca: <strong>{{ biblioteca.nome }}</strong></p>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <div class="biblioteca-form-grid">

                <div class="form-group full-width">
                    <label>Nome do Doador</label>
                    {{ form.nome_doador }}
                </div>

                <div class="form-group">
                    <label>Título do Livro</label>
                    {{ form.titulo }}
                </div>

                <div class="form-group">
                    <label>Autor</label>
                    {{ form.autor }}
                </div>

                <div class="form-group">
                    <label>Categoria</label>
                    {{ form.categoria }}
                </div>

                <div class="form-group">
                    <label>Quantidade</label>
                    {{ form.quantidade }}
                </div>

                <div class="form-group full-width">
                    <label>Descrição</label>
                    {{ form.descricao }}
                </div>

                <div class="form-group full-width">
                    <label>Capa</label>
                    {{ form.capa }}
                </div>

            </div>

            <br>

            <button type="submit" class="auth-btn">
                Registrar Doação
            </button>

        </form>

    </div>

</div>

{% endblock %}
