{% extends 'core/base.html' %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>
            Aprovar Empréstimo
        </h1>

        <p>

            Livro:
            <strong>
                {{ emprestimo.livro.titulo }}
            </strong>

        </p>

        <p>

            Leitor:
            <strong>
                {{ emprestimo.leitor.username }}
            </strong>

        </p>

        <form
            method="POST"
            class="auth-form"
        >

            {% csrf_token %}

            <div class="form-group">

                <label>
                    Quantidade de dias
                </label>

                <input
                    type="number"
                    name="dias"
                    min="1"
                    max="90"
                    class="form-input"
                    required
                >

            </div>

            <button
                type="submit"
                class="auth-btn"
            >

                Confirmar Empréstimo

            </button>

        </form>

    </div>

</div>

{% endblock %}
