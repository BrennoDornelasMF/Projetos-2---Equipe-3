{% extends 'core/base.html' %}

{% block content %}

<div class="biblioteca-form-container">

    <div class="biblioteca-form-card">

        <h1>Registrar Patrocínio</h1>
        <p style="color: #666; margin-bottom: 24px;">Biblioteca: <strong>{{ biblioteca.nome }}</strong></p>

        <form method="POST">

            {% csrf_token %}

            <div class="biblioteca-form-grid">

                <div class="form-group">
                    <label>Nome do Patrocinador</label>
                    {{ form.nome_patrocinador }}
                </div>

                <div class="form-group">
                    <label>Valor (R$)</label>
                    {{ form.valor }}
                </div>

                <div class="form-group full-width">
                    <label>Descrição</label>
                    {{ form.descricao }}
                </div>

            </div>

            <br>

            <button type="submit" class="auth-btn">
                Registrar Patrocínio
            </button>

        </form>

    </div>

</div>

{% endblock %}
