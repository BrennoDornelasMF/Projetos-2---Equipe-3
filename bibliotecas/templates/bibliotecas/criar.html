{% extends 'core/base.html' %}

{% block content %}

<div class="biblioteca-form-container">

    <div class="biblioteca-form-card">

        <h1>Nova Biblioteca</h1>

        <form
            method="POST"
            enctype="multipart/form-data"
        >

            {% csrf_token %}

            <div class="biblioteca-form-grid">

                <div class="form-group">

                    <label>Nome</label>

                    {{ form.nome }}

                </div>

                <div class="form-group">

                    <label>Cidade</label>

                    {{ form.cidade }}

                </div>

                <div class="form-group">

                    <label>Estado</label>

                    {{ form.estado }}

                </div>

                <div class="form-group">

                    <label>Endereço</label>

                    {{ form.endereco }}

                </div>

                <div class="form-group full-width">

                    <label>Descrição</label>

                    {{ form.descricao }}

                </div>

                <div class="form-group full-width">

                    <label>Imagem</label>

                    {{ form.imagem }}

                </div>

            </div>

            <br>

            <button
                type="submit"
                class="auth-btn"
            >
                Criar Biblioteca
            </button>

        </form>

    </div>

</div>

{% endblock %}
